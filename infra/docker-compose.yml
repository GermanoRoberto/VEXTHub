services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vexthub
      POSTGRES_USER: vexthub
      POSTGRES_PASSWORD: vexthub
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./supabase/vexthub_schema.sql:/docker-entrypoint-initdb.d/001_vexthub_schema.sql:ro

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://vexthub:vexthub@postgres:5432/vexthub
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      API_INTERNAL_TOKEN: change-me-in-production
      WEBHOOK_SIGNING_SECRET: change-me-in-production
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  worker:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    command: ["python", "-m", "app.workers.runner"]
    environment:
      DATABASE_URL: postgresql://vexthub:vexthub@postgres:5432/vexthub
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

volumes:
  postgres-data:
  redis-data:
